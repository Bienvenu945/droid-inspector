name: Android CI / Build Droid Inspector X

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Make sure Android SDK 35 is installed
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" || true

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v6
        with:
          name: droid-inspector-x-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Optional: a release build failing here must not hide the debug APK above.
      - name: Build release APK (unsigned, optional)
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v6
        with:
          name: droid-inspector-x-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14
